    {id: 'S', label: 'Puissance apparente', sym: 'S', dim: 'apparent', unit: 'kVA'},
    {id: 'Qr', label: 'Puissance réactive', sym: 'Q', dim: 'reactive', unit: 'kvar'},
    {id: 'Ns', label: 'Vitesse de synchronisme', sym: 'N<sub>s</sub>', dim: 'rot', unit: 'tr/min'},
    {id: 'g', label: 'Glissement', sym: 'g', dim: 'pct', unit: '%'},
    {id: 'Id', label: 'Courant de démarrage direct', sym: 'I<sub>d</sub>', dim: 'current', unit: 'A'},
    {id: 'Cd', label: 'Couple de démarrage direct', sym: 'C<sub>d</sub>', dim: 'torque', unit: 'N·m'},
    {id: 'IdY', label: 'Courant de démarrage en étoile-triangle', sym: 'I<sub>d</sub>/3', dim: 'current', unit: 'A'},
    {id: 'CdY', label: 'Couple de démarrage en étoile-triangle', sym: 'C<sub>d</sub>/3', dim: 'torque', unit: 'N·m'}
  ],
  formulas: ['P<sub>a</sub> = P<sub>n</sub> / η', 'I<sub>n</sub> = P<sub>a</sub> / (√3·U·cos φ)', 'N<sub>s</sub> = 60·f / p', 'g = (N<sub>s</sub> − N<sub>n</sub>) / N<sub>s</sub>', 'C<sub>n</sub> = P<sub>n</sub> / ω<sub>n</sub>', 'Étoile-triangle : I<sub>d</sub>/3 et C<sub>d</sub>/3'],
  hyp: [
    'p = nombre de <b>paires</b> de pôles. Valeurs nominales issues de la plaque signalétique.',
    'Relais thermique (ou disjoncteur-moteur) : réglé sur le courant nominal plaque I<sub>n</sub>.',
    'Étoile-triangle : uniquement pour un moteur dont la tension <b>triangle</b> est égale à la tension du réseau (ex. plaque 400/690 V sur réseau 400 V). Le couple réduit doit rester supérieur au couple résistant de la machine.',
    'Couplage : plaque 230/400 V sur réseau 400 V → <b>étoile</b> ; plaque 400/690 V sur réseau 400 V → <b>triangle</b>.'
  ],
  compute(v, c){
    const Pa = v.Pn / v.eta;
    c.step('Puissance absorbée', 'P<sub>a</sub> = P<sub>n</sub> / η', `${Q(v.Pn, 'kW')} / ${Q(v.eta, '%')}`, Q(Pa, 'kW'));
    const In = Pa / (sqrt(3) * v.U * v.cos), S = sqrt(3) * v.U * In, Qr = S * sqrt(1 - v.cos ** 2);
    c.step('Courant nominal', 'I<sub>n</sub> = P<sub>a</sub> / (√3·U·cos φ)', `${Q(Pa, 'W')} / (1,732 × ${Q(v.U, 'V')} × ${Fmt.num(v.cos)})`, Q(In, 'A'));
    const p = +v.poles / 2, ws = 2 * PI * v.f / p;
    c.step('Vitesse de synchronisme', 'N<sub>s</sub> = 60·f / p', `60 × ${Q(v.f, 'Hz')} / ${p}`, Q(ws, 'tr/min'));
    if (v.N >= ws) return c.err('La vitesse nominale doit être inférieure à la vitesse de synchronisme : vérifier le nombre de pôles.');
    const g = (ws - v.N) / ws;
    c.step('Glissement', 'g = (N<sub>s</sub> − N<sub>n</sub>) / N<sub>s</sub>', `(${Q(ws, 'tr/min')} − ${Q(v.N, 'tr/min')}) / ${Q(ws, 'tr/min')}`, Q(g, '%'));
    const Cn = v.Pn / v.N;
    c.step('Couple nominal', 'C<sub>n</sub> = P<sub>n</sub> / ω<sub>n</sub>', `${Q(v.Pn, 'W')} / ${Q(v.N, 'rad/s')}`, Q(Cn, 'N·m'));
    const Id = v.kI * In, Cd = v.kC * Cn;
    c.step('Courant de démarrage direct', 'I<sub>d</sub> = k<sub>I</sub>·I<sub>n</sub>', `${Fmt.num(v.kI)} × ${Q(In, 'A')}`, Q(Id, 'A'));
    c.step('Couple de démarrage direct', 'C<sub>d</sub> = k<sub>C</sub>·C<sub>n</sub>', `${Fmt.num(v.kC)} × ${Q(Cn, 'N·m')}`, Q(Cd, 'N·m'));
    c.step('Démarrage étoile-triangle', 'I<sub>dY</sub> = I<sub>d</sub>/3 ; C<sub>dY</sub> = C<sub>d</sub>/3', null, `${Q(Id / 3, 'A')} ; ${Q(Cd / 3, 'N·m')}`);
    if (g > 0.1) c.warn('Glissement supérieur à 10 % : inhabituel pour un moteur standard, vérifier la vitesse nominale.');
    c.note(`Réglage du relais thermique : ≈ ${Q(In, 'A')}.`);
    return {In, Cn, Pa, S, Qr, Ns: ws, g, Id, Cd, IdY: Id / 3, CdY: Cd / 3};
  }
});

/* Câbles : données de référence */
const RHO_SERVICE = {cu: 0.0225e-6, al: 0.036e-6};   // résistivité en service [Ω·m] (= 1,25 × valeur à 20 °C)
const LAMBDA_X = 0.08e-3;                              // réactance linéique [Ω/m]
const SECTIONS = [0.75, 1, 1.5, 2.5, 4, 6, 10, 16, 25, 35, 50, 70, 95, 120, 150, 185, 240];
/** Courants admissibles Iz [A] — IEC 60364-5-52, tableau B.52.4, méthode C (câble fixé sur paroi),
    âme cuivre, isolant PVC (70 °C), température ambiante 30 °C ; clé = nombre de conducteurs chargés */
const IZ_C_PVC_CU = {
  2: {1.5: 19.5, 2.5: 27, 4: 36, 6: 46, 10: 63, 16: 85, 25: 112, 35: 138, 50: 168, 70: 213, 95: 258, 120: 299, 150: 344, 185: 392, 240: 461},
  3: {1.5: 17.5, 2.5: 24, 4: 32, 6: 41, 10: 57, 16: 76, 25: 96, 35: 119, 50: 144, 70: 184, 95: 223, 120: 259, 150: 299, 185: 341, 240: 403}
};
Calc.register({
  id: 'el-cable', cat: 'elec', title: 'Câble : chute de tension et section',
  keywords: 'cable section chute de tension longueur conducteur cuivre aluminium iz courant admissible',
  desc: 'Chute de tension d’une ligne, section minimale pour respecter une chute admissible, courant admissible indicatif.',
  inputs: [
    {id: 'res', label: 'Type de circuit', type: 'select', def: 'tri', options: [['dc', 'Courant continu (ex. commande 24 V)'], ['mono', 'Alternatif monophasé'], ['tri', 'Alternatif triphasé']]},
    {id: 'U', label: 'Tension nominale (entre phases en triphasé)', sym: 'U', dim: 'voltage', unit: 'V', def: 400, gt: 0},
    {id: 'I', label: 'Courant d’emploi', sym: 'I<sub>B</sub>', dim: 'current', unit: 'A', def: 16, gt: 0},
    {id: 'L', label: 'Longueur de la ligne (aller simple)', sym: 'L', dim: 'length', unit: 'm', def: 50, gt: 0},
    {id: 'mat', label: 'Matériau de l’âme', type: 'select', def: 'cu', options: [['cu', 'Cuivre'], ['al', 'Aluminium']]},
    {id: 'S', label: 'Section envisagée', type: 'select', def: '2.5', options: SECTIONS.map(s => [String(s), String(s).replace('.', ',') + ' mm²'])},
    {id: 'cos', label: 'Facteur de puissance de la charge', sym: 'cos φ', dim: 'none', unit: '', def: 0.85, gt: 0, max: 1, showIf: v => v.res !== 'dc'},
    {id: 'dUmax', label: 'Chute de tension maximale admise', sym: 'ΔU<sub>max</sub>', dim: 'pct', unit: '%', def: 5, gt: 0, max: 100,
      help: 'IEC 60364-5-52 (annexe G), installation alimentée par le réseau public BT : 3 % éclairage, 5 % autres usages. Vérifier les exigences du RGIE.'}
  ],
  outputs: [
    {id: 'R', label: 'Résistance d’un conducteur', sym: 'R', dim: 'resistance', unit: 'Ω'},
    {id: 'dU', label: 'Chute de tension', sym: 'ΔU', dim: 'voltage', unit: 'V'},
    {id: 'dUp', label: 'Chute de tension relative', sym: 'ΔU/U', dim: 'pct', unit: '%', main: true},
    {id: 'okdU', label: 'Chute de tension', type: 'text'},
    {id: 'Uarr', label: 'Tension à l’arrivée', sym: 'U − ΔU', dim: 'voltage', unit: 'V'},
    {id: 'Pj', label: 'Pertes Joule dans la ligne', sym: 'P<sub>J</sub>', dim: 'power', unit: 'W', units: ['W', 'kW']},
    {id: 'Smin', label: 'Section minimale pour ΔU<sub>max</sub>', type: 'text', main: true},
    {id: 'Iz', label: 'Courant admissible indicatif I<sub>z</sub>', type: 'text'}
  ],
  formulas: v => [
    'R = ρ·L / S ;  X = λ·L',
    v.res === 'dc' ? 'ΔU = 2·R·I<sub>B</sub>' : v.res === 'mono' ? 'ΔU = 2·(R·cos φ + X·sin φ)·I<sub>B</sub>' : 'ΔU = √3·(R·cos φ + X·sin φ)·I<sub>B</sub>',
    'ΔU % = 100·ΔU / U',
    v.res === 'tri' ? 'P<sub>J</sub> = 3·R·I<sub>B</sub>²' : 'P<sub>J</sub> = 2·R·I<sub>B</sub>²'
  ],
  hyp: [
    'Résistivité en service : ρ = 0,0225 Ω·mm²/m (cuivre) ; 0,036 Ω·mm²/m (aluminium), soit 1,25 × la valeur à 20 °C.',
    'Réactance linéique λ = 0,08 mΩ/m (câbles multiconducteurs) ; négligée en continu.',
    'I<sub>z</sub> indicatif : IEC 60364-5-52, méthode C (câble fixé sur paroi), cuivre, isolant PVC, 30 °C, <b>sans facteurs de correction</b> (groupement, température, mode de pose).',
    'Ce calcul ne remplace pas la vérification complète : protection contre les surcharges (I<sub>B</sub> ≤ I<sub>n</sub> ≤ I<sub>z</sub>), courts-circuits, contacts indirects, prescriptions du RGIE.'
  ],
  compute(v, c){
    const rho = RHO_SERVICE[v.mat], S = +v.S * 1e-6;
    const cosf = v.res === 'dc' ? 1 : v.cos, sinf = v.res === 'dc' ? 0 : sqrt(1 - cosf ** 2);
    const k = v.res === 'tri' ? sqrt(3) : 2;
    const du = s => k * (rho * v.L / s * cosf + LAMBDA_X * v.L * sinf) * v.I;
    const R = rho * v.L / S, X = LAMBDA_X * v.L;
    c.step('Résistance d’un conducteur', 'R = ρ·L / S', `${Fmt.num(rho * 1e6)} Ω·mm²/m × ${Q(v.L, 'm')} / ${String(v.S).replace('.', ',')} mm²`, Q(R, 'Ω'));
    if (v.res !== 'dc') c.step('Réactance d’un conducteur', 'X = λ·L', `0,08 mΩ/m × ${Q(v.L, 'm')}`, Q(X, 'Ω'));
    const dU = du(S), dUp = dU / v.U;
    if (v.res === 'dc') c.step('Chute de tension (aller + retour)', 'ΔU = 2·R·I<sub>B</sub>', `2 × ${Q(R, 'Ω')} × ${Q(v.I, 'A')}`, Q(dU, 'V'));
    else c.step('Chute de tension', (v.res === 'tri' ? '√3' : '2') + '·(R·cos φ + X·sin φ)·I<sub>B</sub>',
      `${v.res === 'tri' ? '1,732' : '2'} × (${Q(R, 'Ω')} × ${Fmt.num(cosf)} + ${Q(X, 'Ω')} × ${Fmt.num(sinf)}) × ${Q(v.I, 'A')}`, Q(dU, 'V'));
    c.step('Chute de tension relative', 'ΔU % = 100·ΔU / U', `100 × ${Q(dU, 'V')} / ${Q(v.U, 'V')}`, Q(dUp, '%'));
    const Pj = (v.res === 'tri' ? 3 : 2) * R * v.I ** 2;
    c.step('Pertes Joule', v.res === 'tri' ? 'P<sub>J</sub> = 3·R·I<sub>B</sub>²' : 'P<sub>J</sub> = 2·R·I<sub>B</sub>²', `${v.res === 'tri' ? 3 : 2} × ${Q(R, 'Ω')} × (${Q(v.I, 'A')})²`, Q(Pj, 'W'));
    const sMin = SECTIONS.find(s => du(s * 1e-6) / v.U <= v.dUmax);
    if (sMin) c.step('Section minimale (chute de tension)', 'plus petite section normalisée telle que ΔU % ≤ ΔU<sub>max</sub>', null, String(sMin).replace('.', ',') + ' mm²');
    const okdU = dUp <= v.dUmax;
    // courant admissible indicatif
    let Iz = {text: v.mat === 'cu' ? 'non tabulé pour cette section' : 'non tabulé (aluminium)', status: 'info'};
    const nCh = v.res === 'tri' ? 3 : 2, tab = IZ_C_PVC_CU[nCh];
    if (v.mat === 'cu' && tab[+v.S] != null){
      const iz = tab[+v.S], ok = v.I <= iz;
      Iz = {text: `${Fmt.num(iz)} A ${ok ? '≥ I<sub>B</sub>' : '&lt; I<sub>B</sub> !'}`, status: ok ? 'ok' : 'bad'};
      if (!ok) c.warn(`Courant d’emploi supérieur au courant admissible indicatif (${Fmt.num(iz)} A pour ${String(v.S).replace('.', ',')} mm², ${nCh} conducteurs chargés) : augmenter la section.`);
    }
    if (!sMin) c.warn('Même 240 mm² ne suffit pas : réduire la longueur, augmenter la tension ou mettre des conducteurs en parallèle.');
    if (v.res === 'dc' && v.U <= 48) c.note('En très basse tension (24 V), la chute de tension est souvent le critère dimensionnant : 5 % de 24 V = 1,2 V seulement.');
    return {R, dU, dUp, okdU: okdU ? {text: '≤ ' + Q(v.dUmax, '%') + ' : conforme', status: 'ok'} : {text: '> ' + Q(v.dUmax, '%') + ' : trop élevée', status: 'bad'},
      Uarr: v.U - dU, Pj, Smin: {text: sMin ? String(sMin).replace('.', ',') + ' mm²' : '> 240 mm²'}, Iz};
  }
});

Calc.register({
  id: 'ou-conv', cat: 'outils', title: 'Convertisseur d’unités',
  keywords: 'conversion unite bar psi pa kw ch cv nm debit pouce',
  desc: 'Conversion instantanée entre les unités usuelles d’une même grandeur.',
  /** Interface spécifique (n'utilise pas le formulaire générique) */
  mount(box, st){
    const s = st.conv = st.conv || {dim: 'pressure', v: '1', u: 'bar'};
    const dims = Object.entries(Units.dims).filter(([k]) => !['pct', 'none'].includes(k));
    const selDim = h('select', {class: 'field', id: 'conv-dim'}, dims.map(([k, d]) => h('option', {value: k}, d.n)));
    const inp = h('input', {class: 'field', id: 'conv-val', type: 'text', inputmode: 'decimal', autocomplete: 'off', value: s.v});
    const selU = h('select', {class: 'field', id: 'conv-unit', 'aria-label': 'Unité'});
    const table = h('table', {class: 'conv'});
    const units = () => Object.keys(Units.dims[s.dim].u);
    const fillUnits = () => {
      selU.replaceChildren(...units().map(u => h('option', {value: u}, u)));
      if (!units().includes(s.u)) s.u = units()[0];
      selU.value = s.u;
    };
    const render = () => {
      const n = parseNum(s.v), ok = isFinite(n);
      inp.style.borderColor = ok ? '' : 'var(--bad)';
      table.replaceChildren(...units().map(u => h('tr', {}, h('td', {}, ok ? Fmt.num(Units.fromSI(Units.toSI(n, s.u), u), 6) : '—'), h('td', {}, u))));
      Store.saveSoon();
    };
    if (!Units.dims[s.dim]) s.dim = 'pressure';
    selDim.value = s.dim; fillUnits();
    selDim.onchange = () => { s.dim = selDim.value; fillUnits(); render(); };
    selU.onchange = () => { s.u = selU.value; render(); };
    inp.oninput = () => { s.v = inp.value; render(); };
    box.append(h('div', {class: 'calc-grid'},
      h('div', {class: 'panel'}, h('h3', {}, 'Valeur à convertir'),
        h('div', {class: 'in-row'}, h('label', {class: 'in-label', for: 'conv-dim'}, 'Grandeur'), h('div', {class: 'in-ctrl'}, selDim)),
        h('div', {class: 'in-row'}, h('label', {class: 'in-label', for: 'conv-val'}, 'Valeur'), h('div', {class: 'in-ctrl'}, inp, selU)),
        h('p', {class: 'muted', style: 'font-size:13px;margin:10px 0 0'}, '1 ch (cheval-vapeur métrique) = 735,5 W ; 1 hp = 745,7 W ; 1 kgf = 9,806 65 N ; « NL » = litre d’air ramené à la pression atmosphérique.')),
      h('div', {class: 'panel'}, h('h3', {}, 'Équivalences'), table)));
    render();
  }
});

/* =====================================================================
   8. MODULES FUTURS (emplacements réservés)
   ===================================================================== */
function futureModule(id, label, icon, step, intro, features){
  return {
    id, label, icon, step,
    mount(el){
      el.append(h('div', {class: 'panel placeholder'},
        h('div', {class: 'ph-ic', html: ICONS[icon]}),
        h('h2', {}, label),
        h('p', {class: 'muted'}, `Module prévu à l'étape ${step}. ${intro}`),
        h('ul', {}, features.map(f => h('li', {}, f)))));
    }
  };
}

/* =====================================================================
   10. INSTALLATION (PWA) ET FONCTIONNEMENT HORS LIGNE
   Actif uniquement quand la page est servie en https (GitHub Pages).
   ===================================================================== */
if (/^https?:$/.test(location.protocol)){
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker non enregistré :', e));
  let installEvt = null;
  const btnInstall = document.getElementById('btn-install');
  document.getElementById('ic-install').innerHTML = ICONS.save;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; btnInstall.hidden = false; });
  btnInstall.onclick = async () => {
    if (!installEvt) return;
    installEvt.prompt();
    await installEvt.userChoice;
    installEvt = null; btnInstall.hidden = true;
  };
  window.addEventListener('appinstalled', () => { btnInstall.hidden = true; App.toast('Application installée : retrouvez-la sur le bureau ou dans le menu Démarrer.', 'ok'); });
}
